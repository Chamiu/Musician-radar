name: iTMS New Release Radar

on:
  schedule:
    # 日本時間 毎日 08:00 = UTC 23:00（GitHubのcronはUTC専属）
    - cron: '0 23 * * *'
  workflow_dispatch:   # ウェブ画面から手動発火できる口✨

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-24.04
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: jqを召喚
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 実行権限を付与
        run: chmod +x radar_itms.sh

      - name: レーダー発火（ iTMS版を直呼び）
        run: ./radar_itms.sh

      - name: ログをコミット＆push（新譜があった日だけ）
        run: |
          if [ -z "$(git status --porcelain log/)" ]; then
            echo "※本日の新譜は検知されなかったにゃ（コミットなし）"
            exit 0
          fi

          F=$(git status --porcelain log/ | awk '{print $2}' | head -n1)
          N=$(awk '/^- /' "$F" | wc -l | tr -d ' ')

          ALL=$(awk '/^- |^  - /{print}' "$F")
          [ -z "$ALL" ] && ALL="(詳細は ${F} を参照にゃ)"
          BODY=$(printf '%s\n' "$ALL" | head -n 40)
          LINES=$(printf '%s\n' "$ALL" | wc -l | tr -d ' ')
          if [ "$LINES" -gt 40 ]; then
            BODY="${BODY}
          …（以下略 / 全 ${LINES}行。全文は ${F}）"
          fi

          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add log/
          git commit -m "🆕 radar: $(date -u '+%Y-%m-%d') / ${N}件" -m "$BODY"
          git push
