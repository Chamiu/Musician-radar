name: iTMS New Release Radar

on:
  schedule:
    # 日本時間 毎日 08:00 = UTC 23:00（GitHubのcronはUTC専属）
    - cron: '0 23 * * *'
  workflow_dispatch:   # ウェブ画面から手動発火できる口✨

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-24.04
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: jqを召喚
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 実行権限を付与
        run: chmod +x radar_itms.sh

      - name: レーダー発火（ iTMS版を直呼び）
        run: ./radar_itms.sh

      - name: コミット＆push（新譜があった日だけ）
        if: steps.hit.outputs.yes == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add log/
          BODY=$(awk '/^- /{print}' "${{ steps.hit.outputs.file }}" | head -n 40)
          git commit -m "🆕 radar: $(date '+%Y-%m-%d')" -m "$BODY"
          git push
          else
            echo "※本日の新譜は検知されなかったにゃ（コミットなし）"
          fi
